<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Wireless Phone Connect</title><link rel="stylesheet" href="style.css"></head>
<body><div class="phone-shell panel">
<div class="brandmark">W</div><h1>Wireless Phone Connect</h1>
<p class="muted">This browser page can join the session and share connection status. It cannot access or mirror the entire Android screen by itself.</p>
<label for="deviceName">Device label</label><input id="deviceName" maxlength="50" value="My Android phone">
<button id="joinBtn" class="primary">Join session</button>
<div id="phoneStatus" class="status-note">Not connected</div>
<p class="hint">Only join if you trust the person who shared this QR code. Close this browser tab to end the browser connection.</p>
</div>
<script src="/socket.io/socket.io.js"></script><script src="phone.js"></script></body></html>
